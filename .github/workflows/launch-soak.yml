name: Launch soak

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run models:fetch
      - run: npm run build:win
      - name: Launch it repeatedly
        shell: bash
        env:
          DEBUG: pw:protocol,pw:browser
          SOAK_LOG: soak-debug.log
        run: node scripts/launch-soak.mjs release/win-unpacked/howl.exe 10 10 2> soak-debug.log
