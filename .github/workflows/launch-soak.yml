name: Launch soak

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install the published build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download tune-toy-latest -p howl-setup.exe -D soak
          Start-Process -FilePath soak\howl-setup.exe -ArgumentList '/S' -Wait
      - name: Launch it repeatedly
        shell: pwsh
        run: node scripts/launch-soak.mjs "$env:LOCALAPPDATA\Programs\howl\howl.exe"
