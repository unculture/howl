name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue rather than cancel, so a run is never killed halfway through replacing the release asset.
concurrency:
  group: build-windows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: resources/models
          key: whisper-${{ hashFiles('scripts/fetch-models.mjs') }}

      - run: npm run models:fetch

      - run: npm test

      - run: npm run build:win

      - name: Launch the packaged app
        run: npm run test:smoke -- release/win-unpacked/howl.exe

      - name: Upgrade over the published build while it is running
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\howl"
          $exe = "$dir\howl.exe"
          gh release download tune-toy-latest -p howl-setup.exe -D previous
          Start-Process -FilePath previous\howl-setup.exe -ArgumentList '/S' -Wait
          if (!(Test-Path $exe)) { throw 'The published build did not install' }
          # A leftover file proves the old version is really removed, and a song proves hers survive.
          Set-Content "$dir\left-by-old-version.txt" 'old'
          $songs = [Environment]::GetFolderPath('MyDocuments') + '\howl'
          New-Item -ItemType Directory -Force $songs | Out-Null
          Set-Content "$songs\her song.howl" 'keep me'
          $old = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 4
          Start-Process -FilePath release\howl-setup.exe -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 2
          if (Test-Path "$dir\left-by-old-version.txt") { throw 'The old version was not removed' }
          if (!(Test-Path $exe)) { throw 'The new version did not install' }
          $want = (Get-Content package.json | ConvertFrom-Json).version
          $got = (Get-Item $exe).VersionInfo.ProductVersion
          if ($got -ne $want) { throw "Installed version is $got, wanted $want" }
          $entries = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'howl*' })
          if ($entries.Count -ne 1) { throw "Windows lists $($entries.Count) copies of howl" }
          if ((Get-Content "$songs\her song.howl") -ne 'keep me') { throw 'Her song was changed' }
          Remove-Item "$songs\her song.howl"
          Write-Output "Upgraded to $got. One copy listed, old files gone, her song kept."
          node scripts/launch-soak.mjs $exe 10 0

      - name: Upload smoke test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: test-output/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: howl-windows
          path: release/howl-setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish to the Tune Toy release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=tune-toy-latest
          TITLE="Tune Toy (latest build)"
          NOTES="Built from ${GITHUB_SHA::7}. Download howl-setup.exe and run it. Windows may warn because it is unsigned: choose More info, then Run anyway."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA" --latest
          fi
          gh release upload "$TAG" release/howl-setup.exe --clobber
